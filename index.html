<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Sono:wght@200..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    
    <title>Fact Share</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="logo.png" alt="Fact Share Logo" width="70" style ="border-radius: 50%;">
                <h1>Fact Share</h1>
            </div>
            <button class="btn btn-open-form">Share a fact</button>
        </header>
        <br>

        <form class="fact-form hidden">
            <input type="text" placeholder="Share a fact...">
            <span> 200 </span>
            <input type="text" placeholder="Link a Source...">
            <select>
                <option value="" disabled selected>Choose category:</option>
                <option value="economics">Economics</option>
                <option value="history">History</option>
                <option value="nature">Nature</option>
                <option value="science">Science</option>
                <option value="UK">UK</option>
            </select>
            <button class='btn' type="submit">Submit</button>
        </form>
        <h2>Interesting Facts</h2>
        <main class="main">
            <aside>
                <ul>
                    <li>
                        <button class="btn btn-topic">All</button>
                    </li>
                    <li>
                        <button class="btn btn-topic topic-science">Science</button>
                    </li>
                    <li>
                        <button class="btn btn-topic topic-nature">Nature</button>
                    </li>
                </ul>
            </aside>
            <section>
                <ul>
                    <li class="fact-item">
                        <p>
                            💡 The Eiffel Tower is 330m tall
                            <a class='source' href="https://en.wikipedia.org/wiki/Eiffel_Tower" target="_blank">(Source)</a>
                            <span class="fact-tag topic-science">#science#</span>
                        </p>
                        
                        <div class="vote-buttons">
                            <button>👍 24</button>
                            <button>👎 3</button
                        </div>
                    </li>
                    <li class="fact-item">
                        <p>
                            💡 Bananas are berries, but strawberries are not (strawberries are <i>aggregate fruits</i>).
                            <a class='source' href="https://en.wikipedia.org/wiki/berries" target="_blank">(Source)</a>
                            <span class="fact-tag topic-nature">#nature#</span>
                        </p>
                        
                        <div class="vote-buttons">
                            <button>👍 24</button>
                            <button>👎 3</button
                        </div>
                    </li>
                    <li class="fact-item">
                        <p>
                            💡 Octopuses have three hearts 
                            <a class='source' href="https://en.wikipedia.org/wiki/Octopuses" target="_blank">(Source)</a>
                            <span class="fact-tag topic-nature">#nature#</span>
                        </p>
                        
                        <div class="vote-buttons">
                            <button>👍 24</button>
                            <button>👎 3</button
                        </div>
                    </li>
                </ul>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
